name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vyona
          POSTGRES_PASSWORD: vyona
          POSTGRES_DB: vyona
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vyona"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://vyona:vyona@localhost:5432/vyona
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The production release, after the checks pass on main. scripts/deploy-app.sh downloads it
  # and PM2 runs it on the server; nothing is built there.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://vyonaweligama.com   # inlined by Next at build time
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vyona-release
          path: .release/vyona.tar.gz
          compression-level: 0   # already gzipped
          retention-days: 30
